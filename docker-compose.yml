services:
  web:
    build: .
    ports:
      - "8000:8000"
    develop:
      watch:
        - action: rebuild 
          path: .
    volumes:
      - .:/app
    environment:
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - LATEX_COMPILER_URL=http://latex-online:2700/compile
    depends_on:
      - latex-online

  latex-online:
    image: aslushnikov/latex-online
    ports:
      - "2700:2700"
