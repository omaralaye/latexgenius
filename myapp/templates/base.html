<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LatexGenius — Document to LaTeX Conversion{% endblock %}</title>
    <meta name="description" content="Convert documents to publication-ready LaTeX. AI-powered conversion for researchers, academics, and students.">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232563eb'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='serif' font-weight='bold'>L</text></svg>">
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: { DEFAULT: "#2563eb", hover: "#1d4ed8", light: "#dbeafe", dark: "#60a5fa" },
              secondary: { DEFAULT: "#475569", light: "#f1f5f9", dark: "#94a3b8" },
              accent: { DEFAULT: "#0f172a", light: "#f8fafc", dark: "#e2e8f0" },
              surface: { DEFAULT: "#ffffff", hover: "#f8fafc", dark: "#1e293b", "dark-hover": "#334155" },
              error: { DEFAULT: "#ef4444", light: "#fef2f2", dark: "#fca5a5" },
              border: { DEFAULT: "#e2e8f0", dark: "#334155" },
              "on-surface": "#0f172a",
              "on-surface-variant": "#475569",
              "on-background": "#0f172a",
              "dark-bg": "#1e293b",
              "dark-surface": "#1e293b",
              "dark-surface-alt": "#334155",
              "dark-text": "#e2e8f0",
              "dark-text-muted": "#94a3b8",
              "dark-text-dim": "#94a3b8",
              "dark-border": "#334155",
              "dark-border-strong": "#334155",
              "surface-variant": "#f1f5f9",
              "outline-variant": "#e2e8f0",
              "background": "#f8fafc",
            },
            fontFamily: {
              body: ["Inter", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
            fontSize: {
              xs: ["0.75rem", { lineHeight: "1rem" }],
              sm: ["0.875rem", { lineHeight: "1.25rem" }],
              base: ["1rem", { lineHeight: "1.5rem" }],
              lg: ["1.125rem", { lineHeight: "1.75rem" }],
              xl: ["1.25rem", { lineHeight: "1.75rem" }],
              "2xl": ["1.5rem", { lineHeight: "2rem" }],
              "3xl": ["1.875rem", { lineHeight: "2.25rem" }],
              "4xl": ["2.25rem", { lineHeight: "2.5rem" }],
              "5xl": ["3rem", { lineHeight: "1.1" }],
            },
          },
        },
      }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        .animate-toast {
            animation: slideIn 0.3s ease-out forwards;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.15s ease;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-primary {
            background-color: #2563eb;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #1d4ed8;
        }
        .btn-secondary {
            background-color: transparent;
            border: 1px solid #e2e8f0;
            color: #475569;
        }
        .btn-secondary:hover:not(:disabled) {
            background-color: #f8fafc;
        }
        .dark .btn-secondary {
            border-color: #334155;
            color: #94a3b8;
        }
        .dark .btn-secondary:hover:not(:disabled) {
            background-color: #334155;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-surface text-accent antialiased transition-colors duration-300 dark:bg-surface-dark dark:text-accent-dark">
    {% block layout %}
    {% include "components/navbar.html" %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include "components/footer.html" %}
    {% endblock %}

    <div id="toast-container" class="fixed bottom-5 right-5 z-[100] flex flex-col gap-3"></div>

    {% block extra_scripts %}{% endblock %}
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        function toast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            const bgMap = { success: 'bg-emerald-500', error: 'bg-red-500', info: 'bg-blue-600' };
            const iconMap = { success: 'check_circle', error: 'error', info: 'info' };
            el.className = `${bgMap[type] || bgMap.info} text-white px-6 py-3 rounded-xl shadow-lg flex items-center gap-3 animate-toast`;
            el.innerHTML = `<span class="material-symbols-outlined text-xl">${iconMap[type] || iconMap.info}</span><span class="text-sm font-semibold">${message}</span>`;
            container.appendChild(el);
            setTimeout(() => { el.classList.add('opacity-0', 'translate-x-full'); setTimeout(() => el.remove(), 300); }, 4000);
        }
    </script>
</body>
</html>
