{% extends "base.html" %}

{% block title %}500 — Server error — LaTeXGenius{% endblock %}

{% block layout %}
<div class="min-h-screen bg-secondary-light dark:bg-surface-dark flex flex-col items-center justify-center p-4">
    <div class="text-center">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-error-light dark:bg-error/10 text-error mb-8 border border-error/20">
            <span class="material-symbols-outlined text-4xl">warning</span>
        </div>
        <h1 class="text-6xl font-black text-error mb-4 tracking-tighter">500</h1>
        <h2 class="text-3xl font-bold text-accent dark:text-accent-dark mb-4">Server error</h2>
        <p class="text-secondary dark:text-secondary-dark max-w-md mx-auto mb-8 leading-relaxed">
            Something went wrong. Our team has been notified.
        </p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <button onclick="window.location.reload()" class="btn btn-primary">Retry</button>
            <a href="{% url 'landing' %}" class="btn btn-secondary">Go Home</a>
        </div>
    </div>
</div>
{% endblock %}
