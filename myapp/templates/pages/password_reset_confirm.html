{% extends "base.html" %}
{% block title %}Set New Password — LaTeX Genius{% endblock %}
{% block layout %}
<div class="min-h-screen flex flex-col bg-surface">
<main class="flex-grow flex items-center justify-center px-margin-mobile py-24">
  <div class="w-full max-w-md">
    <div class="text-center mb-10">
      <h1 class="font-headline-lg text-headline-lg text-primary mb-2">Set New Password</h1>
    </div>
    <div class="bg-surface-container-lowest border border-outline-variant/20 rounded-lg p-8">
      {% if validlink %}
      <form method="POST" class="space-y-6">
        {% csrf_token %}
        <div class="space-y-1">
          <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="id_new_password1">New Password</label>
          <input type="password" name="new_password1" id="id_new_password1" class="w-full input-underline py-3 px-4 text-on-surface font-body-md" required>
        </div>
        <div class="space-y-1">
          <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="id_new_password2">Confirm Password</label>
          <input type="password" name="new_password2" id="id_new_password2" class="w-full input-underline py-3 px-4 text-on-surface font-body-md" required>
        </div>
        <button type="submit" class="w-full bg-primary-container text-on-primary-container py-3 rounded-full font-label-md hover:bg-primary hover:text-on-primary transition-all">Change Password</button>
      </form>
      {% else %}
      <p class="text-on-surface-variant text-center">The password reset link was invalid. Please request a new one.</p>
      <a href="{% url 'password_reset' %}" class="mt-6 block text-center text-secondary font-semibold hover:underline">Request new link</a>
      {% endif %}
    </div>
  </div>
</main>
</div>
{% endblock %}
