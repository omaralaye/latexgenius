{% extends "base.html" %}
{% block title %}Contact — LaTeX Genius{% endblock %}
{% block content %}
<section class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-8 pt-28">
    <div class="max-w-2xl mx-auto">
        <div class="text-center mb-12">
            <h1 class="font-display-lg text-display-lg text-primary mb-4">Get in Touch</h1>
            <p class="text-body-lg text-on-surface-variant">Have a question or need help? We'd love to hear from you.</p>
        </div>
        <div class="bg-surface-container-lowest border border-outline-variant/20 rounded-lg p-8 md:p-10">
            <form class="space-y-6">
                <div class="space-y-1">
                    <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="name">Name</label>
                    <input type="text" id="name" class="w-full input-underline py-3 px-4 text-on-surface font-body-md placeholder-outline-variant" placeholder="Your name">
                </div>
                <div class="space-y-1">
                    <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="email">Email</label>
                    <input type="email" id="email" class="w-full input-underline py-3 px-4 text-on-surface font-body-md" placeholder="you@example.com">
                </div>
                <div class="space-y-1">
                    <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="message">Message</label>
                    <textarea id="message" rows="5" class="w-full input-underline py-3 px-4 text-on-surface font-body-md resize-none" placeholder="How can we help?"></textarea>
                </div>
                <button type="submit" class="bg-primary-container text-on-primary-container px-8 py-3 rounded-full font-label-md hover:bg-primary hover:text-on-primary transition-all active:scale-[0.98]">Send Message</button>
            </form>
        </div>
        <p class="text-center mt-6 text-sm text-on-surface-variant">Or email us directly at <a href="mailto:support@latexgenius.com" class="text-secondary hover:underline">support@latexgenius.com</a></p>
    </div>
</section>
{% endblock %}
