{% extends "base.html" %}
{% block title %}Contact — LaTeXGenius{% endblock %}
{% block content %}
<section class="py-20">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-4xl font-extrabold text-accent dark:text-accent-dark mb-6">Contact</h1>
    <p class="text-secondary dark:text-secondary-dark mb-8">Have a question or need help? Reach out to us.</p>
    <div class="bg-white dark:bg-surface-dark rounded-xl border border-border dark:border-border-dark p-8">
      <form>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-secondary dark:text-secondary-dark mb-1" for="name">Name</label>
            <input type="text" id="name" class="w-full px-4 py-3 bg-white dark:bg-surface-dark border border-border dark:border-border-dark rounded-lg focus:ring-2 focus:ring-primary/20 text-accent dark:text-accent-dark transition-all" placeholder="Your name">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-secondary dark:text-secondary-dark mb-1" for="email">Email</label>
            <input type="email" id="email" class="w-full px-4 py-3 bg-white dark:bg-surface-dark border border-border dark:border-border-dark rounded-lg focus:ring-2 focus:ring-primary/20 text-accent dark:text-accent-dark transition-all" placeholder="you@example.com">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-secondary dark:text-secondary-dark mb-1" for="message">Message</label>
            <textarea id="message" rows="5" class="w-full px-4 py-3 bg-white dark:bg-surface-dark border border-border dark:border-border-dark rounded-lg focus:ring-2 focus:ring-primary/20 text-accent dark:text-accent-dark transition-all" placeholder="How can we help?"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send message</button>
        </div>
      </form>
    </div>
    <div class="mt-8 text-center text-sm text-secondary dark:text-secondary-dark">
      Or email us directly at <a href="mailto:support@latexgenius.com" class="text-primary hover:text-primary-hover transition-colors">support@latexgenius.com</a>
    </div>
  </div>
</section>
{% endblock %}
