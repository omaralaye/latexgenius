{% extends "base.html" %}
{% block title %}Check Your Email — LaTeX Genius{% endblock %}
{% block layout %}
<div class="min-h-screen flex flex-col bg-surface">
<main class="flex-grow flex items-center justify-center px-margin-mobile py-24">
  <div class="w-full max-w-md text-center">
    <div class="bg-surface-container-lowest border border-outline-variant/20 rounded-lg p-10">
      <span class="material-symbols-outlined text-5xl text-primary mb-4">mail</span>
      <h1 class="font-headline-lg text-headline-lg text-primary mb-2">Check Your Email</h1>
      <p class="text-on-surface-variant">We've sent a password reset link to your email address if it's registered with us.</p>
      <a href="{% url 'login' %}" class="mt-8 inline-block text-secondary font-semibold hover:underline">Back to login</a>
    </div>
  </div>
</main>
</div>
{% endblock %}
