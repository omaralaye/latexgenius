{% extends "base.html" %}

{% block title %}Settings — LaTeX Genius{% endblock %}

{% block content %}
<div class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-8 pt-28">
    <div class="mb-10">
        <h1 class="font-headline-lg text-headline-lg text-primary">Settings</h1>
        <p class="text-on-surface-variant">Manage your account preferences</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-[200px_1fr] gap-gutter">
        <nav class="flex lg:flex-col gap-2">
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-primary-container/20 text-primary font-semibold text-sm" data-tab="account">
                <span class="material-symbols-outlined text-lg">person</span>
                Account
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-dim/30 text-sm transition-colors" data-tab="appearance">
                <span class="material-symbols-outlined text-lg">palette</span>
                Appearance
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-dim/30 text-sm transition-colors" data-tab="notifications">
                <span class="material-symbols-outlined text-lg">notifications</span>
                Notifications
            </a>
        </nav>

        <div class="bg-surface-container-lowest border border-outline-variant/20 rounded-lg p-8">
            <div id="account" class="tab-content">
                <h2 class="font-headline-md text-primary mb-6">Account Settings</h2>
                <form method="POST" class="space-y-6 max-w-lg">
                    {% csrf_token %}
                    <div class="space-y-1">
                        <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Full Name</label>
                        <input class="w-full input-underline py-3 px-4 text-on-surface font-body-md" type="text" name="name" value="{{ user.get_full_name|default:user.username }}" placeholder="Your full name"/>
                    </div>
                    <div class="space-y-1">
                        <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Email</label>
                        <input class="w-full input-underline py-3 px-4 text-on-surface font-body-md" type="email" name="email" value="{{ user.email }}" placeholder="you@university.edu"/>
                    </div>
                    <div class="space-y-1">
                        <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Institution</label>
                        <input class="w-full input-underline py-3 px-4 text-on-surface font-body-md" type="text" name="institution" value="{{ user_profile.institution|default:'' }}" placeholder="University or research institution"/>
                    </div>
                    <button type="submit" class="bg-primary-container text-on-primary-container px-6 py-3 rounded-full font-label-md hover:bg-primary hover:text-on-primary transition-all active:scale-[0.98]">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
