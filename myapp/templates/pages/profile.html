{% extends "base.html" %}

{% block title %}Profile — LaTeX Genius{% endblock %}

{% block content %}
<div class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-8 pt-28">
    <div class="mb-10">
        <h1 class="font-headline-lg text-headline-lg text-primary">Profile</h1>
        <p class="text-on-surface-variant">Manage your public profile</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-[280px_1fr] gap-gutter">
        <div class="bg-surface-container-lowest border border-outline-variant/20 rounded-lg p-8 text-center">
            <div class="w-24 h-24 rounded-full bg-forest-light mx-auto mb-4 flex items-center justify-center">
                <span class="material-symbols-outlined text-4xl text-on-primary-container">person</span>
            </div>
            <h3 class="font-headline-md text-primary">{{ user.get_full_name|default:user.username }}</h3>
            <p class="text-sm text-on-surface-variant">{{ user.email }}</p>
            <button class="mt-4 text-label-md text-secondary hover:underline">Change photo</button>
        </div>

        <div class="bg-surface-container-lowest border border-outline-variant/20 rounded-lg p-8">
            <h2 class="font-headline-md text-primary mb-6">Personal Information</h2>
            <form method="POST" class="space-y-6 max-w-lg">
                {% csrf_token %}
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">First Name</label>
                        <input class="w-full input-underline py-3 px-4 text-on-surface font-body-md" type="text" name="first_name" value="{{ user.first_name }}"/>
                    </div>
                    <div class="space-y-1">
                        <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Last Name</label>
                        <input class="w-full input-underline py-3 px-4 text-on-surface font-body-md" type="text" name="last_name" value="{{ user.last_name }}"/>
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Institution</label>
                    <input class="w-full input-underline py-3 px-4 text-on-surface font-body-md" type="text" name="institution" value="{{ user_profile.institution|default:'' }}"/>
                </div>
                <div class="space-y-1">
                    <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Department</label>
                    <input class="w-full input-underline py-3 px-4 text-on-surface font-body-md" type="text" name="department" value="{{ user_profile.department|default:'' }}"/>
                </div>
                <button type="submit" class="bg-primary-container text-on-primary-container px-6 py-3 rounded-full font-label-md hover:bg-primary hover:text-on-primary transition-all active:scale-[0.98]">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
