{% extends "base.html" %}

{% block title %}Password Reset — LaTeXGenius{% endblock %}

{% block layout %}
<div class="min-h-screen flex flex-col bg-secondary-light dark:bg-surface-dark">
<main class="flex-grow flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-primary">LaTeXGenius</h1>
    </div>

    <div class="bg-white dark:bg-surface-dark rounded-xl p-8 border border-border dark:border-border-dark text-center">
      <span class="material-symbols-outlined text-5xl text-green-600 mb-4">check_circle</span>
      <h2 class="text-xl font-bold text-accent dark:text-accent-dark mb-2">Password Reset Complete</h2>
      <p class="text-sm text-secondary dark:text-secondary-dark mb-6">Your password has been successfully reset. You can now log in with your new password.</p>
      <a href="{% url 'login' %}" class="btn btn-primary py-3 px-8">Log in</a>
    </div>
  </div>
</main>

<footer class="w-full py-6 border-t border-border dark:border-border-dark">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center px-4 gap-4">
    <span class="text-xs text-secondary dark:text-secondary-dark">&copy; 2026 LaTeXGenius</span>
  </div>
</footer>
</div>
{% endblock %}
