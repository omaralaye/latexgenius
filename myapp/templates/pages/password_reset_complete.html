{% extends "base.html" %}
{% block title %}Password Reset Complete — LaTeX Genius{% endblock %}
{% block layout %}
<div class="min-h-screen flex flex-col bg-surface">
<main class="flex-grow flex items-center justify-center px-margin-mobile py-24">
  <div class="w-full max-w-md text-center">
    <div class="bg-surface-container-lowest border border-outline-variant/20 rounded-lg p-10">
      <span class="material-symbols-outlined text-5xl text-primary mb-4">check_circle</span>
      <h1 class="font-headline-lg text-headline-lg text-primary mb-2">Password Reset Complete</h1>
      <p class="text-on-surface-variant mb-8">Your password has been successfully changed.</p>
      <a href="{% url 'login' %}" class="bg-primary-container text-on-primary-container px-8 py-3 rounded-full font-label-md hover:bg-primary hover:text-on-primary transition-all inline-flex items-center gap-2">
        Log In
        <span class="material-symbols-outlined text-lg">arrow_forward</span>
      </a>
    </div>
  </div>
</main>
</div>
{% endblock %}
