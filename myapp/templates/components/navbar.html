<header class="fixed top-0 w-full z-50 backdrop-blur-md bg-surface/90 border-b border-outline-variant/30 h-16">
    <nav class="flex justify-between items-center max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop h-full">
        <a href="{% url 'landing' %}" class="text-headline-md font-bold text-primary flex items-center gap-2">
            <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
            LaTeX Genius
        </a>
        <div class="hidden md:flex items-center gap-8 font-label-md text-label-md">
            <a class="{% if request.resolver_match.url_name == 'templates' %}text-primary font-semibold{% else %}text-on-surface-variant hover:text-primary{% endif %} transition-colors duration-200" href="{% url 'templates' %}">Templates</a>
            <a class="{% if request.resolver_match.url_name == 'features' %}text-primary font-semibold{% else %}text-on-surface-variant hover:text-primary{% endif %} transition-colors duration-200" href="{% url 'features' %}">Features</a>
            <a class="{% if request.resolver_match.url_name == 'pricing' %}text-primary font-semibold{% else %}text-on-surface-variant hover:text-primary{% endif %} transition-colors duration-200" href="{% url 'pricing' %}">Pricing</a>
            <a class="{% if request.resolver_match.url_name == 'documentation' %}text-primary font-semibold{% else %}text-on-surface-variant hover:text-primary{% endif %} transition-colors duration-200" href="{% url 'documentation' %}">Docs</a>
        </div>
        <div class="flex items-center gap-3">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="bg-primary-container text-on-primary-container px-5 py-2 rounded-full font-label-md text-sm hover:bg-primary transition-all shadow-sm">Dashboard</a>
                <a href="{% url 'logout' %}" class="text-sm font-label-md text-on-surface-variant hover:text-primary transition-colors">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="hidden md:block text-on-surface-variant font-label-md px-4 py-2 hover:text-primary transition-all">Sign In</a>
                <a href="{% url 'signup' %}" class="bg-primary text-on-primary px-5 py-2 rounded-full font-label-md text-sm hover:opacity-90 active:scale-95 transition-all shadow-sm">Get Started</a>
            {% endif %}
        </div>
    </nav>
</header>
