<header class="sticky top-0 z-50 bg-white dark:bg-surface-dark border-b border-border dark:border-border-dark">
    <nav class="flex justify-between items-center w-full px-4 sm:px-6 lg:px-8 py-3 max-w-7xl mx-auto">
        <a href="{% url 'landing' %}" class="text-xl font-extrabold text-primary">LaTeXGenius</a>
        <div class="hidden md:flex items-center space-x-6 text-sm font-medium">
            <a class="{% if request.resolver_match.url_name == 'landing' %}text-primary{% else %}text-secondary dark:text-secondary-dark{% endif %} hover:text-primary transition-colors" href="{% url 'landing' %}">Features</a>
            <a class="{% if request.resolver_match.url_name == 'templates' %}text-primary{% else %}text-secondary dark:text-secondary-dark{% endif %} hover:text-primary transition-colors" href="{% url 'templates' %}">Templates</a>
            <a class="{% if request.resolver_match.url_name == 'pricing' %}text-primary{% else %}text-secondary dark:text-secondary-dark{% endif %} hover:text-primary transition-colors" href="{% url 'pricing' %}">Pricing</a>
            <a class="{% if request.resolver_match.url_name == 'documentation' %}text-primary{% else %}text-secondary dark:text-secondary-dark{% endif %} hover:text-primary transition-colors" href="{% url 'documentation' %}">Documentation</a>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleTheme()" class="p-2 text-secondary dark:text-secondary-dark hover:bg-secondary-light dark:hover:bg-surface-dark-hover rounded-lg transition-colors" aria-label="Toggle theme">
                <span class="material-symbols-outlined dark:hidden">dark_mode</span>
                <span class="material-symbols-outlined hidden dark:block">light_mode</span>
            </button>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="btn btn-primary text-sm">Dashboard</a>
                <a href="{% url 'logout' %}" class="text-sm text-secondary dark:text-secondary-dark hover:text-primary transition-colors">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-primary text-sm">Get Started</a>
            {% endif %}
        </div>
    </nav>
</header>
